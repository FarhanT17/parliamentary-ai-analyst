app = "parliamentary-ai-backend"
primary_region = "lhr"

[build]
  [build.args]
    PYTHON_VERSION = "3.11"

[env]
  COLLECT_FRESH_DATA = "false"
  USE_SAMPLE_FALLBACK = "true"

[[services]]
  internal_port = 8000
  protocol = "tcp"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443
