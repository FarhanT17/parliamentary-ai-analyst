version: "1"
services:
- type: web
  name: parliamentary-ai-backend
  runtime: python
  repo: https://github.com/FarhanT17/parliamentary-ai-analyst
  plan: free
  envVars:
  - key: OPENAI_API_KEY
    sync: false
  - key: PARLIAMENT_FETCH_DETAIL_PAGES
    sync: false
  - key: PARLIAMENT_MIN_EVIDENCE_CHARS
    sync: false
  - key: PYTHON_VERSION
    sync: false
  - key: CORS_ORIGINS
    sync: false
  - key: USE_SAMPLE_FALLBACK
    sync: false
  - key: COLLECT_FRESH_DATA
    sync: false
  region: oregon
  buildCommand: |
    cd backend
    pip install --no-cache-dir -r requirements.txt
  startCommand: |
    cd backend
    uvicorn app.main:app --host 0.0.0.0 --port $PORT
  healthCheckPath: /health
  autoDeployTrigger: commit