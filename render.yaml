services:
  - type: web
    name: parliamentary-ai-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: |
      cd backend
      pip install --no-cache-dir -r requirements-light.txt
    startCommand: |
      cd backend
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: COLLECT_FRESH_DATA
        value: false
      - key: USE_SAMPLE_FALLBACK
        value: true
      - key: CORS_ORIGINS
        value: https://parliamentary-ai-analyst.vercel.app,http://localhost:3000,http://localhost:5173
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health
